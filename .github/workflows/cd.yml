name: Fittrek CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy FitTrek to EC2
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout code
      # ==========================================
      - name: Checkout code
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup SSH
      # ==========================================
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/fittrek.pem

          chmod 600 ~/.ssh/fittrek.pem

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts


      # ==========================================
      # 3. Prepare EC2
      #    Node.js + PM2 + Swap
      # ==========================================
      - name: Prepare EC2
        run: |
          ssh -i ~/.ssh/fittrek.pem ubuntu@${{ secrets.EC2_HOST }} "bash -s" <<'REMOTE_SCRIPT'
          set -e

          echo "================================="
          echo "Preparing EC2"
          echo "================================="


          # ------------------------------------------
          # Node.js 24
          # ------------------------------------------
          echo "Checking Node.js..."

          if ! command -v node >/dev/null 2>&1 || ! node -v | grep -q '^v24\.'; then

            echo "Installing Node.js 24..."

            sudo apt-get update -y
            sudo apt-get install -y curl

            curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -

            sudo apt-get install -y nodejs

          else

            echo "Node.js 24 already installed."

          fi


          # ------------------------------------------
          # PM2
          # ------------------------------------------
          echo "Checking PM2..."

          if ! command -v pm2 >/dev/null 2>&1; then

            echo "Installing PM2..."

            sudo npm install -g pm2

          else

            echo "PM2 already installed."

          fi


          # ------------------------------------------
          # 2GB Swap
          # ------------------------------------------
          echo "Checking swap..."

          if ! sudo swapon --show | grep -q '/swapfile'; then

            echo "Creating 2GB swap..."

            sudo fallocate -l 2G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile

            echo "2GB swap enabled."

          else

            echo "Swap already exists."

          fi


          # ------------------------------------------
          # Memory
          # ------------------------------------------
          echo "================================="
          echo "Memory information"
          echo "================================="

          free -h


          # ------------------------------------------
          # Versions
          # ------------------------------------------
          echo "================================="
          echo "Software versions"
          echo "================================="

          echo "Node:"
          node -v

          echo "npm:"
          npm -v

          echo "PM2:"
          pm2 -v


          echo "================================="
          echo "EC2 preparation successful."
          echo "================================="

          REMOTE_SCRIPT


      # ==========================================
      # 4. Copy application to EC2
      # ==========================================
      - name: Copy application to EC2
        run: |
          echo "Copying FitTrek application..."

          tar \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.git \
            --exclude='terraform/.terraform' \
            --exclude='terraform/*.tfstate' \
            --exclude='terraform/*.tfstate.*' \
            -czf - . | \
          ssh -i ~/.ssh/fittrek.pem \
            ubuntu@${{ secrets.EC2_HOST }} \
            "rm -rf /home/ubuntu/fittrek && \
             mkdir -p /home/ubuntu/fittrek && \
             tar -xzf - -C /home/ubuntu/fittrek"

          echo "Application copied successfully."


      # ==========================================
      # 5. Create production environment
      # ==========================================
      - name: Create production environment
        env:
          AUTH_SECRET_VALUE: ${{ secrets.AUTH_SECRET }}
          HEALTH_WEBHOOK_SECRET_VALUE: ${{ secrets.HEALTH_WEBHOOK_SECRET }}
        run: |
          ssh -i ~/.ssh/fittrek.pem ubuntu@${{ secrets.EC2_HOST }} \
            "AUTH_SECRET_VALUE='$AUTH_SECRET_VALUE' HEALTH_WEBHOOK_SECRET_VALUE='$HEALTH_WEBHOOK_SECRET_VALUE' bash -s" <<'REMOTE_SCRIPT'

          set -e

          cd /home/ubuntu/fittrek

          echo "Creating production environment..."

          cat > .env <<ENV_FILE
          DATABASE_URL="file:./dev.db"
          AUTH_SECRET="$AUTH_SECRET_VALUE"
          HEALTH_WEBHOOK_SECRET="$HEALTH_WEBHOOK_SECRET_VALUE"
          ENV_FILE

          chmod 600 .env

          echo "Production environment created."

          REMOTE_SCRIPT


      # ==========================================
      # 6. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          ssh -i ~/.ssh/fittrek.pem ubuntu@${{ secrets.EC2_HOST }} "bash -s" <<'REMOTE_SCRIPT'

          set -e

          cd /home/ubuntu/fittrek

          echo "================================="
          echo "Installing dependencies"
          echo "================================="

          npm ci

          echo "Dependencies installed successfully."

          REMOTE_SCRIPT


      # ==========================================
      # 7. Generate Prisma Client
      # ==========================================
      - name: Generate Prisma Client
        run: |
          ssh -i ~/.ssh/fittrek.pem ubuntu@${{ secrets.EC2_HOST }} "bash -s" <<'REMOTE_SCRIPT'

          set -e

          cd /home/ubuntu/fittrek

          echo "================================="
          echo "Generating Prisma Client"
          echo "================================="

          npx prisma generate

          echo "Prisma Client generated successfully."

          REMOTE_SCRIPT


      # ==========================================
      # 8. Update database
      # ==========================================
      - name: Update database
        run: |
          ssh -i ~/.ssh/fittrek.pem ubuntu@${{ secrets.EC2_HOST }} "bash -s" <<'REMOTE_SCRIPT'

          set -e

          cd /home/ubuntu/fittrek

          echo "================================="
          echo "Updating database"
          echo "================================="

          npx prisma db push

          echo "Database updated successfully."

          REMOTE_SCRIPT


      # ==========================================
      # 9. Build Next.js application
      # ==========================================
      - name: Build application
        run: |
          ssh -i ~/.ssh/fittrek.pem ubuntu@${{ secrets.EC2_HOST }} "bash -s" <<'REMOTE_SCRIPT'

          set -e

          cd /home/ubuntu/fittrek

          echo "================================="
          echo "Building FitTrek"
          echo "================================="

          npm run build

          echo "Build completed successfully."

          REMOTE_SCRIPT


      # ==========================================
      # 10. Start application with PM2
      # ==========================================
      - name: Start application with PM2
        run: |
          ssh -i ~/.ssh/fittrek.pem ubuntu@${{ secrets.EC2_HOST }} "bash -s" <<'REMOTE_SCRIPT'

          set -e

          cd /home/ubuntu/fittrek

          echo "================================="
          echo "Starting FitTrek"
          echo "================================="

          echo "Stopping previous application..."

          pm2 delete fittrek || true

          echo "Starting new application..."

          pm2 start npm --name fittrek -- start

          echo "Saving PM2 process..."

          pm2 save

          echo "Application status:"

          pm2 status

          REMOTE_SCRIPT


      # ==========================================
      # 11. Verify application
      # ==========================================
      - name: Verify application
        run: |
          echo "Waiting for FitTrek to start..."

          sleep 10

          ssh -i ~/.ssh/fittrek.pem ubuntu@${{ secrets.EC2_HOST }} "bash -s" <<'REMOTE_SCRIPT'

          set -e

          echo "================================="
          echo "Checking FitTrek"
          echo "================================="

          curl -f http://localhost:3000

          echo ""

          echo "================================="
          echo "FitTrek deployed successfully!"
          echo "================================="

          pm2 status

          REMOTE_SCRIPT